<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Swarm Simulation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      gap: 16px;
    }

    h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #a0d8ef;
      margin-top: 8px;
    }

    #stats {
      display: flex;
      gap: 32px;
      font-size: 0.95rem;
    }

    .stat-label { color: #888; }
    .stat-value { color: #7fffb4; font-weight: bold; font-size: 1.1rem; }

    #canvas-wrapper {
      position: relative;
      border: 2px solid #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0, 200, 255, 0.15);
    }

    canvas { display: block; }

    #controls {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 28px;
      border: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.35; cursor: default; }

    #btn-start  { background: #2ecc71; color: #111; }
    #btn-stop   { background: #e74c3c; color: #fff; }
    #btn-reset  { background: #3498db; color: #fff; }
    #btn-reset.pending { background: #f39c12; }

    #status {
      font-size: 0.8rem;
      color: #666;
      height: 1em;
    }

    #progress-bar-wrapper {
      width: 100%;
      max-width: 640px;
      background: #2a2a4a;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2ecc71, #a0d8ef);
      transition: width 0.2s;
      border-radius: 4px;
    }

    /* ── Simulation row: canvas + agent panel side by side ── */
    #sim-row {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      width: 100%;
      max-width: 960px;
      justify-content: center;
    }

    /* ── Agent inspector panel ── */
    #agent-panel {
      width: 240px;
      min-width: 220px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      font-size: 0.85rem;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    #agent-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #2a2a4a;
    }

    #agent-panel-title {
      font-weight: bold;
      color: #a0d8ef;
      letter-spacing: 0.5px;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    #agent-panel-close {
      background: none;
      border: 1px solid #444;
      color: #aaa;
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: 0;
      text-transform: none;
      transition: background 0.15s;
      min-width: unset;
    }
    #agent-panel-close:hover { background: #2a2a4a; }

    #agent-panel-hint {
      padding: 20px 12px;
      color: #555;
      font-size: 0.8rem;
      text-align: center;
    }

    #agent-panel-body {
      display: none;
      padding: 10px 12px;
      flex-direction: column;
      gap: 6px;
    }
    #agent-panel-body.visible { display: flex; }

    .ap-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 6px;
    }

    .ap-stat-label {
      color: #777;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ap-stat-value {
      color: #e0e0e0;
      font-weight: bold;
      text-align: right;
      word-break: break-all;
    }

    .ap-status-healthy { color: #7fffb4; }
    .ap-status-crashed { color: #e74c3c; }

    .ap-divider {
      border: none;
      border-top: 1px solid #2a2a4a;
      margin: 4px 0;
    }

    .ap-section-title {
      font-size: 0.7rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7fffb4;
      margin: 2px 0 4px;
    }

    #ap-nearby-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 260px;
      overflow-y: auto;
    }

    .ap-agent-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 4px 8px;
      align-items: center;
      padding: 3px 4px;
      border-radius: 3px;
      font-size: 0.78rem;
    }
    .ap-agent-row:nth-child(odd) { background: #1a2a3a; }
    .ap-agent-name { color: #a0d8ef; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ap-agent-dist { color: #7fffb4; text-align: right; white-space: nowrap; }
    .ap-agent-bearing { color: #f39c12; text-align: right; white-space: nowrap; }
    .ap-nearby-header { background: none !important; border-bottom: 1px solid #2a2a4a; margin-bottom: 2px; }
    .ap-col-label { color: #555; font-size: 0.72rem; letter-spacing: 0.5px; text-transform: uppercase; }

    @media (max-width: 700px) {
      #sim-row { flex-direction: column; align-items: center; }
      #agent-panel { width: 100%; max-width: 640px; min-width: unset; }
      #ap-nearby-list { max-height: 160px; }
    }

    /* ── Config panel ── */
    #config-panel {
      width: 100%;
      max-width: 640px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      overflow: hidden;
    }

    #config-panel summary {
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #a0d8ef;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #config-panel summary::before { content: '▶'; font-size: 0.7rem; transition: transform 0.2s; }
    #config-panel[open] summary::before { transform: rotate(90deg); }

    .config-body {
      padding: 12px 16px 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 24px;
    }

    @media (max-width: 500px) {
      .config-body { grid-template-columns: 1fr; }
    }

    .config-section-title {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #7fffb4;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 4px;
      margin-top: 4px;
    }

    .config-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-row label {
      font-size: 0.8rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .config-row label span {
      color: #fff;
      font-weight: bold;
      min-width: 40px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #a0d8ef;
      cursor: pointer;
    }

    .color-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .color-row label {
      font-size: 0.8rem;
      color: #aaa;
    }
    .color-row input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 2px;
      background: #2a2a4a;
    }

    .reset-hint {
      grid-column: 1 / -1;
      font-size: 0.75rem;
      color: #f39c12;
      display: none;
    }
    .reset-hint.visible { display: block; }
  </style>
</head>
<body>
  <h1>🐝 A Swarm Simulation</h1>

  <div id="stats">
    <div>
      <span class="stat-label">Steps </span>
      <span class="stat-value" id="stat-steps">0</span>
    </div>
    <div>
      <span class="stat-label">Grass cut </span>
      <span class="stat-value" id="stat-cut">0.00%</span>
    </div>
    <div>
      <span class="stat-label">Agents </span>
      <span class="stat-value" id="stat-agents">—</span>
    </div>
  </div>

  <div id="progress-bar-wrapper">
    <div id="progress-bar"></div>
  </div>

  <div id="sim-row">
    <div id="canvas-wrapper">
      <canvas id="canvas"></canvas>
    </div>

    <div id="agent-panel">
      <div id="agent-panel-header">
        <span id="agent-panel-title" aria-label="Agent Inspector">🤖 Agent Inspector</span>
        <button id="agent-panel-close">✕</button>
      </div>
      <div id="agent-panel-hint">Click an agent to inspect</div>
      <div id="agent-panel-body">
        <div class="ap-stat-row">
          <span class="ap-stat-label">Status</span>
          <span class="ap-stat-value" id="ap-status">—</span>
        </div>
        <div class="ap-stat-row">
          <span class="ap-stat-label">Position</span>
          <span class="ap-stat-value" id="ap-position">—</span>
        </div>
        <div class="ap-stat-row">
          <span class="ap-stat-label">Speed</span>
          <span class="ap-stat-value" id="ap-speed">—</span>
        </div>
        <div class="ap-stat-row">
          <span class="ap-stat-label">Heading</span>
          <span class="ap-stat-value" id="ap-heading">—</span>
        </div>
        <div class="ap-stat-row">
          <span class="ap-stat-label">Move angle</span>
          <span class="ap-stat-value" id="ap-angle">—</span>
        </div>
        <hr class="ap-divider" />
        <div class="ap-section-title">Nearby agents</div>
        <div class="ap-agent-row ap-nearby-header">
          <span class="ap-col-label">Agent</span>
          <span class="ap-col-label" style="text-align:right">Dist</span>
          <span class="ap-col-label" style="text-align:right">Bearing</span>
        </div>
        <div id="ap-nearby-list"></div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button id="btn-start">▶ Start</button>
    <button id="btn-stop" disabled>⏹ Stop</button>
    <button id="btn-reset">↺ Reset</button>
  </div>

  <details id="config-panel">
    <summary>⚙ Configuration</summary>
    <div class="config-body">

      <div class="config-section-title">Simulation</div>

      <div class="config-row">
        <label>Simulation speed (ms/step) <span id="val-stepIntervalMs">50</span></label>
        <input type="range" id="sl-stepIntervalMs" min="10" max="500" step="10" value="50" />
      </div>

      <div class="config-row">
        <label>Number of agents <span id="val-numAgents">30</span></label>
        <input type="range" id="sl-numAgents" min="1" max="100" step="1" value="30" />
      </div>

      <div class="reset-hint" id="reset-hint">↺ Reset required to apply agent count change</div>

      <div class="config-section-title">Swarm Behavior</div>

      <div class="config-row">
        <label>Cohesion (l) <span id="val-l">0.999</span></label>
        <input type="range" id="sl-l" min="0.5" max="0.9999" step="0.0001" value="0.999" />
      </div>

      <div class="config-row">
        <label>Attraction distance <span id="val-attractionDistanceScalar">1.5</span></label>
        <input type="range" id="sl-attractionDistanceScalar" min="0.5" max="5" step="0.1" value="1.5" />
      </div>

      <div class="config-row">
        <label>Node influence (scalar) <span id="val-scalar">1.0</span></label>
        <input type="range" id="sl-scalar" min="0" max="5" step="0.1" value="1.0" />
      </div>

      <div class="config-section-title">Visuals</div>

      <div class="config-row">
        <label>Agent size <span id="val-agentSize">2.5</span></label>
        <input type="range" id="sl-agentSize" min="0.5" max="6" step="0.5" value="2.5" />
      </div>

      <div class="color-row">
        <label>Healthy agent color</label>
        <input type="color" id="col-healthy" value="#2ecc71" />
      </div>

      <div class="color-row">
        <label>Crashed agent color</label>
        <input type="color" id="col-crashed" value="#e74c3c" />
      </div>

    </div>
  </details>

  <div id="status">Connecting…</div>

  <script>
    const canvas   = document.getElementById('canvas');
    const ctx      = canvas.getContext('2d');
    const btnStart = document.getElementById('btn-start');
    const btnStop  = document.getElementById('btn-stop');
    const btnReset = document.getElementById('btn-reset');
    const statusEl = document.getElementById('status');

    const MAX_CANVAS_PX = 640;
    let SCALE = 1;
    let fieldW = 200, fieldH = 200;

    // ── Visual settings (client-side only) ────────────────────
    let visualAgentSize  = 2.5;
    let visualHealthyCol = '#2ecc71';
    let visualCrashedCol = '#e74c3c';

    // ── Swarm zone radii (sent by server) ──────────────────────
    let swarmRepulsionRadius = 0;
    let swarmAttractionRadius = 0;


    function grassColor(height, boundary) {
      if (boundary) return { r: 40, g: 40, b: 60 };
      if (height === 0) return { r: 30, g: 160, b: 200 };  // cut: teal
      // uncut: red/green gradient matching Java original
      const t = height / 10;
      const r = Math.round(149 * t);
      const g = Math.round(255 - (250 * t));
      return { r, g, b: 235 };
    }

    function initCanvas(w, h) {
      fieldW = w; fieldH = h;
      SCALE = Math.max(1, Math.floor(MAX_CANVAS_PX / Math.max(w, h)));
      canvas.width  = w * SCALE;
      canvas.height = h * SCALE;
    }

    // Render grass as a single ImageData pass for performance
    function renderGrass(grassList) {
      const imgData = ctx.createImageData(canvas.width, canvas.height);
      const d = imgData.data;

      for (const g of grassList) {
        const col = grassColor(g.height, g.boundary);
        // Grass nodes use 1-based coordinates; subtract 1 to convert to 0-based pixel offsets
        const px0 = (g.x - 1) * SCALE;
        const py0 = (g.y - 1) * SCALE;
        for (let dy = 0; dy < SCALE; dy++) {
          for (let dx = 0; dx < SCALE; dx++) {
            const idx = ((py0 + dy) * canvas.width + (px0 + dx)) * 4;
            d[idx]     = col.r;
            d[idx + 1] = col.g;
            d[idx + 2] = col.b;
            d[idx + 3] = 255;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    function renderAgents(agents) {
      const r = Math.max(3, SCALE * visualAgentSize);
      for (const a of agents) {
        const cx = a.x * SCALE;
        const cy = a.y * SCALE;
        const isSelected = a.id === selectedAgentId;

        // selection ring + zone circles
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(cx, cy, r + 5, 0, Math.PI * 2);
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // repulsion zone
          ctx.beginPath();
          ctx.arc(cx, cy, swarmRepulsionRadius * SCALE, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(231, 76, 60, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          // attraction zone
          ctx.beginPath();
          ctx.arc(cx, cy, swarmAttractionRadius * SCALE, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(46, 204, 113, 0.5)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // body
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = a.crashed ? visualCrashedCol : visualHealthyCol;
        ctx.fill();
        ctx.strokeStyle = a.crashed ? '#ff6b6b' : '#7fffb4';
        ctx.lineWidth = 1;
        ctx.stroke();

        // direction indicator
        const rad = (a.angle * Math.PI) / 180;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(rad) * r * 1.4, cy + Math.sin(rad) * r * 1.4);
        ctx.strokeStyle = '#f39c12';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // ── Config panel wiring ────────────────────────────────────
    function applyConfig(cfg) {
      if (cfg.l                      !== undefined) setSlider('l', cfg.l, 4);
      if (cfg.repulsionRadius          !== undefined) swarmRepulsionRadius  = cfg.repulsionRadius;
      if (cfg.attractionRadius         !== undefined) swarmAttractionRadius = cfg.attractionRadius;
      if (cfg.scalar                 !== undefined) setSlider('scalar',                 cfg.scalar,                 1);
      if (cfg.attractionDistanceScalar !== undefined) setSlider('attractionDistanceScalar', cfg.attractionDistanceScalar, 1);
      if (cfg.stepIntervalMs         !== undefined) setSlider('stepIntervalMs',         cfg.stepIntervalMs,         0);
      if (cfg.numAgents              !== undefined) setSlider('numAgents',              cfg.numAgents,              0);
    }

    function setSlider(id, value, decimals) {
      const sl  = document.getElementById('sl-' + id);
      const val = document.getElementById('val-' + id);
      if (sl)  sl.value  = value;
      if (val) val.textContent = Number(value).toFixed(decimals);
    }

    let configDebounce = null;
    function sendConfig(patch) {
      clearTimeout(configDebounce);
      configDebounce = setTimeout(() => {
        send({ action: 'config', ...patch });
      }, 80);
    }

    function wireSlider(id, decimals, serverKey) {
      const sl  = document.getElementById('sl-' + id);
      const val = document.getElementById('val-' + id);
      sl.addEventListener('input', () => {
        const v = parseFloat(sl.value);
        val.textContent = v.toFixed(decimals);
        sendConfig({ [serverKey || id]: v });
      });
    }

    wireSlider('stepIntervalMs',         0, 'stepIntervalMs');
    wireSlider('l',                      4, 'l');
    wireSlider('attractionDistanceScalar', 1, 'attractionDistanceScalar');
    wireSlider('scalar',                 1, 'scalar');

    // Agent count — requires reset
    const slAgents   = document.getElementById('sl-numAgents');
    const valAgents  = document.getElementById('val-numAgents');
    const resetHint  = document.getElementById('reset-hint');
    slAgents.addEventListener('input', () => {
      const v = parseInt(slAgents.value, 10);
      valAgents.textContent = v;
      resetHint.classList.add('visible');
      btnReset.classList.add('pending');
      sendConfig({ numAgents: v });
    });

    // Visual sliders (client-side only)
    const slSize = document.getElementById('sl-agentSize');
    const valSize = document.getElementById('val-agentSize');
    slSize.addEventListener('input', () => {
      visualAgentSize = parseFloat(slSize.value);
      valSize.textContent = visualAgentSize.toFixed(1);
    });

    document.getElementById('col-healthy').addEventListener('input', (e) => {
      visualHealthyCol = e.target.value;
    });
    document.getElementById('col-crashed').addEventListener('input', (e) => {
      visualCrashedCol = e.target.value;
    });

    // ── Agent inspector ────────────────────────────────────────
    let selectedAgentId = null;
    let lastAgents = [];

    const agentPanel      = document.getElementById('agent-panel');
    const agentPanelTitle = document.getElementById('agent-panel-title');
    const agentPanelHint  = document.getElementById('agent-panel-hint');
    const agentPanelBody  = document.getElementById('agent-panel-body');
    const agentPanelClose = document.getElementById('agent-panel-close');

    function speedLabel(speed) {
      const SPEED_FAST      = 15;
      const SPEED_MEDIUM    = 10;
      const SPEED_SLOW      = 2;
      const SPEED_VERY_SLOW = 1;
      if (speed >= SPEED_FAST)      return 'FAST';
      if (speed >= SPEED_MEDIUM)    return 'MEDIUM';
      if (speed >= SPEED_SLOW)      return 'SLOW';
      if (speed >= SPEED_VERY_SLOW) return 'VERY SLOW';
      return 'STOPPED';
    }

    function bearingCompass(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
    }

    // Replicate server-side State.generateRelativePolarCoordinate in JS
    function relativePosition(ax, ay, aAngle, bx, by) {
      const i = bx - ax;
      const j = by - ay;
      const dist = Math.sqrt(i * i + j * j);
      if (dist === 0) return { distance: 0, bearing: 0 };
      let angle = Math.trunc((Math.acos(j / dist) * 180) / Math.PI);
      if (i < 0) angle = 360 - angle;
      angle = angle >= aAngle ? angle - aAngle : 360 - (aAngle - angle);
      return { distance: dist, bearing: angle };
    }

    function updateAgentPanel(agents) {
      if (!selectedAgentId) return;
      const agent = agents.find(a => a.id === selectedAgentId);
      if (!agent) {
        deselectAgent();
        return;
      }

      agentPanelTitle.textContent = '🤖 ' + agent.id;
      agentPanelHint.style.display  = 'none';
      agentPanelBody.classList.add('visible');

      const statusEl = document.getElementById('ap-status');
      if (agent.crashed) {
        statusEl.textContent = '● CRASHED';
        statusEl.className = 'ap-stat-value ap-status-crashed';
      } else {
        statusEl.textContent = '● HEALTHY';
        statusEl.className = 'ap-stat-value ap-status-healthy';
      }

      document.getElementById('ap-position').textContent =
        '(' + agent.x.toFixed(1) + ',\u2009' + agent.y.toFixed(1) + ')';

      const spd = agent.speed != null ? agent.speed : 0;
      document.getElementById('ap-speed').textContent =
        spd + ' — ' + speedLabel(spd);

      const heading = agent.heading != null ? agent.heading : 0;
      document.getElementById('ap-heading').textContent =
        heading.toFixed(0) + '°  ' + bearingCompass(heading);

      document.getElementById('ap-angle').textContent =
        agent.angle.toFixed(0) + '°';

      // Nearby agents sorted by distance
      const nearbyList = document.getElementById('ap-nearby-list');
      const others = agents
        .filter(a => a.id !== agent.id)
        .map(a => {
          const rel = relativePosition(agent.x, agent.y, heading, a.x, a.y);
          return { id: a.id, distance: rel.distance, bearing: rel.bearing, crashed: a.crashed };
        })
        .sort((a, b) => a.distance - b.distance);

      nearbyList.innerHTML = '';
      for (const o of others) {
        const row = document.createElement('div');
        row.className = 'ap-agent-row';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'ap-agent-name';
        nameSpan.title = o.id;
        nameSpan.textContent = o.id + (o.crashed ? ' 💥' : '');

        const distSpan = document.createElement('span');
        distSpan.className = 'ap-agent-dist';
        distSpan.textContent = o.distance.toFixed(1);

        const bearingSpan = document.createElement('span');
        bearingSpan.className = 'ap-agent-bearing';
        bearingSpan.textContent = o.bearing.toFixed(0) + '° ' + bearingCompass(o.bearing);

        row.appendChild(nameSpan);
        row.appendChild(distSpan);
        row.appendChild(bearingSpan);
        nearbyList.appendChild(row);
      }
    }

    function deselectAgent() {
      selectedAgentId = null;
      agentPanelTitle.textContent = '🤖 Agent Inspector';
      agentPanelHint.style.display = '';
      agentPanelBody.classList.remove('visible');
    }

    agentPanelClose.addEventListener('click', deselectAgent);

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const canvasX = (e.clientX - rect.left) * (canvas.width  / rect.width);
      const canvasY = (e.clientY - rect.top)  * (canvas.height / rect.height);
      const fieldX = canvasX / SCALE;
      const fieldY = canvasY / SCALE;

      // Hit-test: a click within HIT_RADIUS_MULTIPLIER × the visual radius counts as a hit
      const MIN_HIT_RADIUS_PX  = 8;   // minimum hit target in pixels, regardless of scale
      const MIN_SCALE_MULT     = 3;   // minimum agent radius multiplier
      const HIT_RADIUS_MULTIPLIER = 2;
      const agentRadiusPx = Math.max(MIN_HIT_RADIUS_PX, SCALE * visualAgentSize);
      // convert pixel radius to field-unit radius, then expand by multiplier
      const HIT_RADIUS = (Math.max(MIN_SCALE_MULT, agentRadiusPx) / SCALE) * HIT_RADIUS_MULTIPLIER;

      let closest = null;
      let closestDist = Infinity;
      for (const a of lastAgents) {
        const d = Math.sqrt(Math.pow(a.x - fieldX, 2) + Math.pow(a.y - fieldY, 2));
        if (d < closestDist) { closestDist = d; closest = a; }
      }

      if (closest && closestDist <= HIT_RADIUS) {
        selectedAgentId = closest.id;
        updateAgentPanel(lastAgents);
      } else {
        deselectAgent();
      }
    });

    // ── WebSocket ──────────────────────────────────────────────
    const ws = new WebSocket(`ws://${location.host}`);
    let initialized = false;

    ws.onopen = () => { statusEl.textContent = 'Connected — press Start to begin'; };
    ws.onclose = () => { statusEl.textContent = 'Disconnected'; };
    ws.onerror = () => { statusEl.textContent = 'Connection error'; };

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);

      if (msg.type === 'init') {
        initCanvas(msg.fieldWidth, msg.fieldHeight);
        initialized = true;
        if (msg.config) applyConfig(msg.config);
        resetHint.classList.remove('visible');
        btnReset.classList.remove('pending');
      }

      if (msg.type === 'config') {
        if (msg.config) applyConfig(msg.config);
      }

      if (msg.type === 'state' && initialized) {
        lastAgents = msg.agents;
        renderGrass(msg.grass);
        renderAgents(msg.agents);
        updateAgentPanel(msg.agents);

        document.getElementById('stat-steps').textContent = msg.steps.toLocaleString();
        document.getElementById('stat-cut').textContent   = msg.percentCut.toFixed(2) + '%';
        document.getElementById('stat-agents').textContent = msg.agents.length;
        document.getElementById('progress-bar').style.width = Math.min(msg.percentCut, 100) + '%';
      }
    };

    function send(payload) {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
    }

    btnStart.addEventListener('click', () => {
      send({ action: 'start' });
      btnStart.disabled = true;
      btnStop.disabled  = false;
      statusEl.textContent = 'Running…';
    });

    btnStop.addEventListener('click', () => {
      send({ action: 'stop' });
      btnStart.disabled = false;
      btnStop.disabled  = true;
      statusEl.textContent = 'Paused';
    });

    btnReset.addEventListener('click', () => {
      send({ action: 'reset' });
      btnStart.disabled = false;
      btnStop.disabled  = true;
      statusEl.textContent = 'Reset — press Start to begin';
    });
  </script>
</body>
</html>
